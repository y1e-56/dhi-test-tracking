services:
  - type: static
    name: dhi-test-tracking-app
    env: static
    region: frankfurt
    rootDir: DHI-LOGICEL
    buildCommand: npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://dhi-test-tracking-api.onrender.com/api
      - key: VITE_SENTRY_DSN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: dhi-test-tracking-api
    env: node
    region: frankfurt
    plan: free
    autoDeploy: false
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dhi-test-tracking-db
          property: connectionString
      - key: JWT_SECRET
        value: dhi-test-tracking-local-secret-2024
      - key: SENTRY_DSN
        value: https://6ea5b8f0627b795807186445b3538d35@o4511892356464640.ingest.de.sentry.io/4511892491599952
      - key: CORS_ORIGIN
        value: dev
      - key: CORS_ORIGINS
        value: https://dhi-test-tracking-app.onrender.com
      - key: APP_URL
        value: https://dhi-test-tracking-app.onrender.com
      - key: PORT
        value: "10000"
      # ── Email (alerte des administrateurs hors poste, mot de passe oublié, réinitialisation) ──
      # À renseigner dans le dashboard Render (Environment) avec les mêmes valeurs que backend/.env
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: dhi-test-tracking-db
    region: frankfurt
    plan: free
    databaseName: dhi_test_tracking
